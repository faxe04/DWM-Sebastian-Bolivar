<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Semana 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container-fluid mt-3">
        <!-- Navbar = 12 -->
        <div class="row">
            <!-- col-*: uso de tamaño en la columna; p-*: padding-->
            <div class="bg-primary col-12 text-white p-3">
                <h1>Navbar</h1>
            </div>
        </div>

        <!-- 3+6+3 = 12 -->
        <div class="row mt-3">
            <div class="bg-secondary col-3">left-Bar</div>
            <div class="bg-warning col-6">Content</div>
            <div class="bg-danger col-3">Right-Bar</div>
        </div>

        <!-- 3+3+3+3 = 12 -->
        <div class="row mt-3">
            <div class="bg-danger col-3">3</div>
            <div class="bg-primary col-3">3</div>
            <div class="bg-secondary col-3">3</div>
            <div class="bg-warning col-3">3</div>
        </div>

        <!-- 2+3+3+4 = 12-->
        <div class="row">
            <div class="bg-primary col-2">2</div>
            <div class="bg-info col-3">3</div>
            <div class="bg-success col-3">3</div>
            <div class="bg-secondary col-4">4</div>
        </div>

        <!-- Extra responsive: -->
        <!-- col-sm-*, col-md-* y col-lg-* para cambiar columnas dependiendo del tamaño de la ventana (small, mid, large) -->
        <div class="row mt-3">
            <div class="bg-secondary col-12 col-md-4 text-white p-3">Zona 1</div>
            <div class="bg-light col-12 col-md-8 p-3">Zona 2</div>
        </div>
        
        <div class="row mt-3">
            <div class="bg-info col-12 col-sm-6 col-lg-3 p-3">Columna 1</div>
            <div class="bg-warning col-12 col-sm-6 col-lg-3 p-3">Columna 2</div>
            <div class="bg-success col-12 col-sm-6 col-lg-3 text-white p-3">Columna 3</div>
            <div class="bg-danger col-12 col-sm-6 col-lg-3 text-white p-3">Columna 4</div>
        </div>

    </div>
</body>
</html>
